plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.douyinweb'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.douyinweb"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'

    // Mixing androidx.appcompat 1.6.1 (which pulls kotlin-stdlib-jdk7/jdk8 1.6.21)
    // with androidx.activity 1.8.2 (which pulls kotlin-stdlib 1.8.22) made the two old
    // jdk7/jdk8 artifacts overlap with classes already shipped inside kotlin-stdlib 1.8+,
    // which fails :app:checkDebugDuplicateClasses.
    // From Kotlin 1.8 the jdk7/jdk8 artifacts are empty shims that only re-export
    // kotlin-stdlib, so aligning all Kotlin artifacts on one version removes the
    // duplicate classes and keeps kotlin-stdlib the single source of truth.
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}